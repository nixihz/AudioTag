name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  website:
    name: Website tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/site.test.cjs tests/local_editor.test.cjs

  swift:
    name: Swift tests
    # Package.swift 声明 swift-tools-version 6.0.0，需要 Swift 6 工具链。
    # macos-14 镜像只带 Swift 5.10，包解析阶段即失败。
    # macos-15 镜像自带 Swift 6.1，其 IRGen 在生成 @isolated(any) 闭包擦除 thunk
    # 时会触发 "SmallVector unable to grow" 编译器崩溃（上游缺陷）。这里保留
    # macos-15 的 runner 供给，改由 swiftly 安装更新的编译器。
    # macos-26 镜像虽然工具链更合适，但公开仓库常因 arm64 容量不足而排队超时。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"
      - name: Show toolchain
        run: swift --version
      - name: Run Swift package tests
        run: swift test

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  website:
    name: Website tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/site.test.cjs tests/local_editor.test.cjs

  swift:
    name: Swift tests
    # Package.swift 声明 swift-tools-version 6.0.0，需要 Swift 6 工具链；
    # macos-14 镜像只带 Swift 5.10，会直接解析失败。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run Swift package tests
        run: swift test

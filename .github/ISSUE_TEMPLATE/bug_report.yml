name: Bug report
description: 报告一个可以复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并移除音频、封面、歌词和日志中的个人信息。
  - type: input
    id: version
    attributes:
      label: AudioTag 版本
      placeholder: 例如 1.0.0 或 commit SHA
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统环境
      placeholder: 例如 macOS 14.6 Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小输入和实际结果，并说明预期结果。
    validations:
      required: true

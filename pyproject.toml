[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3tag-local"
version = "0.1.0"
description = "AudioTag 本地音频标签、歌词和封面编辑工具"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mutagen>=1.47,<2", "pillow>=11,<13", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
audiotag = "mp3tag.cli:main"
mp3tag = "mp3tag.cli:main"

[tool.setuptools.packages.find]
include = ["mp3tag*"]

[tool.setuptools.package-data]
mp3tag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
